# Alternative ClusterRoleBinding for process-based backend deployment
# Use this if backend runs as a Node.js process (not as a Kubernetes pod)
# 
# Usage:
#   1. Replace <USERNAME> with the actual username/service account that runs the backend
#   2. Apply: kubectl apply -f clusterrolebinding-user.yaml
#
# Or bind to a specific user:
#   kubectl create clusterrolebinding store-provisioner-user-binding \
#     --clusterrole=store-provisioner \
#     --user=<username>
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: store-provisioner-user-binding
  labels:
    app: store-provisioner
subjects:
# Option 1: Bind to a specific user (replace <USERNAME> with actual username)
- kind: User
  name: <USERNAME>  # Replace with actual username that runs backend process
  apiGroup: rbac.authorization.k8s.io
# Option 2: Bind to a group (if using groups)
# - kind: Group
#   name: backend-operators
#   apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: store-provisioner
  apiGroup: rbac.authorization.k8s.io

