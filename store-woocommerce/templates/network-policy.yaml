{{- if and .Values.networkPolicy .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "store-woocommerce.fullname" . }}-network-policy
  labels:
    {{- include "store-woocommerce.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from Traefik ingress controller (kube-system namespace)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
  # Allow ingress from Traefik ingress controller (if deployed in traefik-system namespace)
  - from:
    - namespaceSelector:
        matchLabels:
          name: traefik-system
    ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
  # Allow ingress from same namespace (for internal communication)
  - from:
    - namespaceSelector:
        matchLabels:
          name: {{ .Release.Namespace }}
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow egress to same namespace (for internal communication)
  - to:
    - namespaceSelector:
        matchLabels:
          name: {{ .Release.Namespace }}
  # Allow egress to internet (for external API calls, package downloads, etc.)
  - {}
{{- end }}

