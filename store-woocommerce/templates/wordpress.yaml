apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store-woocommerce.fullname" . }}-wordpress
  labels:
    {{- include "store-woocommerce.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "store-woocommerce.selectorLabelsWordpress" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store-woocommerce.selectorLabelsWordpress" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 33

      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Fixing permissions on WordPress volume..."
              chown -R 33:33 /var/www/html
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

      containers:
        - name: wordpress
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          env:
            - name: WORDPRESS_DB_HOST
              value: {{ include "store-woocommerce.fullname" . }}-mariadb
            - name: WORDPRESS_DB_USER
              value: {{ .Values.mariadb.auth.username }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-woocommerce.mariadbSecretName" . }}
                  key: password
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: PHP_MEMORY_LIMIT
              value: 256M
            - name: PHP_MAX_EXECUTION_TIME
              value: "300"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}

      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: {{ include "store-woocommerce.fullname" . }}-wordpress-data
