apiVersion: batch/v1
kind: Job
metadata:
  name: wc-bootstrap
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure

      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: wordpress-data
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Fixing permissions on WordPress volume..."
              mkdir -p /var/www/html
              chown -R 33:33 /var/www/html
              chmod -R 775 /var/www/html
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
      containers:
        - name: wp-cli
          image: wordpress:cli
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi

          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb:3306
            - name: WORDPRESS_DB_USER
              value: wpuser
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: password
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WP_CLI_CACHE_DIR
              value: /tmp/wp-cli-cache
            - name: WP_CLI_PHP_ARGS
              value: "-d memory_limit=512M -d max_execution_time=300"

          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html

          command:
            - sh
            - -c
            - |
              set -e

              mkdir -p /tmp/wp-cli-cache
              cd /var/www/html

              echo "⬇️ Downloading WordPress..."
              if [ ! -f wp-settings.php ]; then
                wp core download \
                  --allow-root \
                  --force \
                  --skip-content
              fi

              echo "📝 Creating wp-config.php with SSL disabled..."
              if [ ! -f wp-config.php ]; then
                cat > wp-config.php <<'WPCONFIG'
              <?php
              define('DB_NAME', getenv('WORDPRESS_DB_NAME'));
              define('DB_USER', getenv('WORDPRESS_DB_USER'));
              define('DB_PASSWORD', getenv('WORDPRESS_DB_PASSWORD'));
              define('DB_HOST', getenv('WORDPRESS_DB_HOST'));
              define('DB_CHARSET', 'utf8');
              define('DB_COLLATE', '');

              // Disable SSL for MySQL connection
              define('MYSQL_CLIENT_FLAGS', 0);

              // Security keys - using simple values for testing
              define('AUTH_KEY',         'put your unique phrase here');
              define('SECURE_AUTH_KEY',  'put your unique phrase here');
              define('LOGGED_IN_KEY',    'put your unique phrase here');
              define('NONCE_KEY',        'put your unique phrase here');
              define('AUTH_SALT',        'put your unique phrase here');
              define('SECURE_AUTH_SALT', 'put your unique phrase here');
              define('LOGGED_IN_SALT',   'put your unique phrase here');
              define('NONCE_SALT',       'put your unique phrase here');

              $table_prefix = 'wp_';

              define('WP_DEBUG', false);
              define('FORCE_SSL_ADMIN', false);

              if ( !defined('ABSPATH') )
                  define('ABSPATH', dirname(__FILE__) . '/');

              require_once(ABSPATH . 'wp-settings.php');
              WPCONFIG
              fi

              echo "⏳ Waiting for database..."
              echo "🔍 Testing connection with PHP mysqli (SSL disabled)..."
              
              for i in $(seq 1 60); do
                if php -r "
                  \$host = getenv('WORDPRESS_DB_HOST');
                  \$user = getenv('WORDPRESS_DB_USER');
                  \$pass = getenv('WORDPRESS_DB_PASSWORD');
                  \$db = getenv('WORDPRESS_DB_NAME');
                  
                  list(\$hostname, \$port) = explode(':', \$host . ':3306');
                  
                  mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
                  try {
                    \$conn = mysqli_init();
                    mysqli_options(\$conn, MYSQLI_OPT_SSL_VERIFY_SERVER_CERT, false);
                    mysqli_real_connect(\$conn, \$hostname, \$user, \$pass, \$db, \$port, null, 0);
                    echo 'Connected successfully';
                    mysqli_close(\$conn);
                    exit(0);
                  } catch (Exception \$e) {
                    echo 'Connection failed: ' . \$e->getMessage();
                    exit(1);
                  }
                " 2>&1; then
                  echo "✅ Database connection successful!"
                  break
                else
                  echo "❌ Connection failed, retrying in 5 seconds... (attempt $i/60)"
                  sleep 5
                fi
              done

              echo "🚀 Installing WordPress..."
              if ! wp core is-installed --allow-root 2>/dev/null; then
                wp core install \
                  --url="http://{{ .Release.Name }}.127.0.0.1.nip.io" \
                  --title="Woo Store" \
                  --admin_user=admin \
                  --admin_password=admin123 \
                  --admin_email=admin@example.com \
                  --skip-email \
                  --allow-root
              fi

              echo "🛒 Installing WooCommerce..."
              wp plugin install woocommerce --activate --allow-root

              echo "📦 Creating test product..."
              # Use --user=admin to authenticate WooCommerce REST API calls
              if ! wp wc product list --user=admin --allow-root 2>/dev/null | grep -q "Test Product"; then
                wp wc product create \
                  --name="Test Product" \
                  --regular_price=100 \
                  --user=admin \
                  --allow-root
              else
                echo "Test product already exists, skipping creation"
              fi

              echo "⚙️ Configuring WooCommerce settings..."
              wp option update woocommerce_cod_enabled yes --allow-root
              wp option update woocommerce_cod_settings '{"enabled":"yes","title":"Cash on delivery","description":"Pay with cash upon delivery.","instructions":"Pay with cash upon delivery.","enable_for_methods":"","enable_for_virtual":"yes"}' --format=json --allow-root
              
              # Enable registration and guest checkout
              wp option update woocommerce_enable_signup_and_login_from_checkout yes --allow-root
              wp option update woocommerce_enable_guest_checkout yes --allow-root
              wp option update woocommerce_enable_checkout_login_reminder yes --allow-root

              # Enable customer registration on My Account page
              echo "👥 Enabling customer registration..."
              wp option update users_can_register 1 --allow-root
              wp option update woocommerce_enable_myaccount_registration yes --allow-root

              # Configure permalinks and URLs
              echo "🔧 Configuring permalinks and URLs..."
              wp option update home "http://{{ .Release.Name }}.127.0.0.1.nip.io" --allow-root
              wp option update siteurl "http://{{ .Release.Name }}.127.0.0.1.nip.io" --allow-root
              wp rewrite structure '/%postname%/' --allow-root
              wp rewrite flush --allow-root

              echo "✅ WooCommerce bootstrap complete"
              echo ""
              echo "🎉 Your WooCommerce store is ready!"
              echo "   URL: http://{{ .Release.Name }}.127.0.0.1.nip.io"
              echo "   Admin: http://{{ .Release.Name }}.127.0.0.1.nip.io/wp-admin"
              echo "   Username: admin"
              echo "   Password: admin123"