apiVersion: batch/v1
kind: Job
metadata:
  name: wc-bootstrap
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure

      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: wordpress-data

      containers:
        - name: wp-cli
          image: wordpress:cli

          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html

          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb
            - name: WORDPRESS_DB_USER
              value: wpuser
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: password
            - name: WORDPRESS_DB_NAME
              value: wordpress
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

          command:
            - sh
            - -c
            - |
              set -e

              echo "Waiting for MariaDB TCP socket..."
              until nc -z mariadb 3306; do
                sleep 5
              done

              echo "Database is reachable"

              if ! [ -f wp-config-sample.php ]; then
                echo "Downloading WordPress..."
                wp core download --skip-content
              fi

              if ! wp core is-installed; then
                echo "Installing WordPress..."
                wp core install \
                  --url="http://{{ .Release.Name }}.127.0.0.1.nip.io" \
                  --title="Woo Store {{ .Release.Name }}" \
                  --admin_user=admin \
                  --admin_password=admin123 \
                  --admin_email=admin@example.com \
                  --skip-email
              else
                echo "WordPress already installed"
              fi

              echo "Installing WooCommerce..."
              wp plugin install woocommerce --activate || true

              echo "Creating test product if missing..."
              wp wc product list --user=admin | grep "Test Product" || \
              wp wc product create \
                --name="Test Product" \
                --regular_price=100 \
                --user=admin

              echo "Enabling Cash on Delivery..."
              wp option update woocommerce_cod_enabled yes

              echo "WooCommerce bootstrap complete"
