# Local environment values for WooCommerce store
# Use with: helm install <name> ./store-woocommerce -f store-woocommerce/values-local.yaml

# Ingress configuration for local (Traefik)
ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  # Hosts will be auto-generated from backend --set commands
  # Format: <store-name>.127.0.0.1.nip.io
  hosts: []  # Auto-generated by backend via --set ingress.hosts[0].host
  tls: []

# Wordpress configuration
wordpress:
  storage: 2Gi
  storageClass: ""  # Use cluster default (standard for Kind, local-path for k3d/k3s)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# MariaDB configuration
mariadb:
  storage: 1Gi
  storageClass: ""  # Use cluster default (standard for Kind, local-path for k3d/k3s)
  auth:
    username: wpuser
    password: wp_pass
    rootPassword: root_pass
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

# Autoscaling disabled for local
autoscaling:
  enabled: false

# Single replica for local
replicaCount: 1

# Network policy for local (optional - can be enabled for testing network isolation)
networkPolicy:
  enabled: false

# Admin user for local development
admin:
  # Email will be auto-generated from ingress host/domain if not provided
  # Override via --set admin.email=<custom-email> if needed
  email: ""  # Auto-generated from domain, or override via --set
