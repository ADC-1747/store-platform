# Production environment values for WooCommerce store
# Works with k3s and k3d clusters (Traefik ingress, local-path storage)
# Use with: helm install <name> ./store-woocommerce -f store-woocommerce/values-prod.yaml

# Ingress configuration for k3s/k3d cluster (Traefik)
ingress:
  enabled: true
  className: "traefik"  # k3s/k3d default ingress controller
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # cert-manager annotations will be added by backend when provisioning with real domain
  # Hosts will be auto-generated from backend --set commands
  # Format: <store-name>.<domain>
  hosts: []  # Auto-generated by backend via --set ingress.hosts[0].host
  tls: []  # Auto-generated by backend for production domains

# Wordpress configuration
wordpress:
  storage: 20Gi
  storageClass: "local-path"  # k3s default storage class
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# MariaDB configuration
mariadb:
  storage: 10Gi
  storageClass: "local-path"  # k3s default storage class
  auth:
    username: wpuser
    # IMPORTANT: Password MUST be provided via --set or external secrets
    # DO NOT use default passwords in production
    password: ""  # Override via --set mariadb.auth.password=<secure-password>
    rootPassword: ""  # Override via --set mariadb.auth.rootPassword=<secure-password>
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

# Autoscaling enabled for production
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Multiple replicas for high availability
replicaCount: 2

# Admin user for production
admin:
  username: admin
  # IMPORTANT: Password MUST be provided via --set or external secrets
  # DO NOT use default passwords in production
  password: ""  # Override via --set admin.password=<secure-password>
  # Email will be auto-generated from ingress host/domain if not provided
  # Format: admin@<domain> (e.g., if domain is "store.example.com", email becomes "admin@example.com")
  # Override via --set admin.email=<custom-email> if needed
  email: ""  # Auto-generated from domain, or override via --set

# Network policy for production (enabled by default for network isolation)
networkPolicy:
  enabled: true
