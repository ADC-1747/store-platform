apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medusa-backend
  template:
    metadata:
      labels:
        app: medusa-backend
    spec:
      containers:
        - name: medusa
          image: {{ .Values.backend.image }}
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "dev"]
          env:
            - name: DATABASE_URL
              value: postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}?sslmode=disable

            - name: JWT_SECRET
              value: supersecret
            - name: COOKIE_SECRET
              value: supersecret
            - name: NODE_ENV
              value: production
            - name: MEDUSA_ADMIN_EMAIL
              value: "admin@example.com"
            - name: MEDUSA_ADMIN_PASSWORD
              value: "supersecret"
            - name: MEDUSA_ADMIN_FIRST_NAME
              value: "Admin"
            - name: MEDUSA_ADMIN_LAST_NAME
              value: "User"
            - name: MEDUSA_ADMIN_ONBOARDING_TYPE
              value: "nextjs"
          ports:
            - containerPort: {{ .Values.backend.port }}

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 20
            periodSeconds: 10

          resources:
            requests:
              memory: "2Gi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "500m"
