{{- if and .Values.ingress .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medusa-ingress
  namespace: {{ .Release.Namespace }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- if and .Values.ingress .Values.ingress.hosts (gt (len .Values.ingress.hosts) 0) }}
    {{- /* Use hosts from values if provided */}}
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if eq .name "backend" }}medusa-backend{{ else }}medusa-storefront{{ end }}
                port:
                  number: {{ if eq .name "backend" }}{{ $.Values.backend.port }}{{ else }}{{ $.Values.storefront.port }}{{ end }}
          {{- end }}
    {{- end }}
    {{- else }}
    {{- /* Fallback: construct hosts from store.domain */}}
    {{- $storefrontHost := include "store-medusa.storefrontHost" . }}
    {{- $backendHost := include "store-medusa.backendHost" . }}
    # Storefront
    - host: {{ $storefrontHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medusa-storefront
                port:
                  number: {{ .Values.storefront.port }}
    # Backend / Admin
    - host: {{ $backendHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medusa-backend
                port:
                  number: {{ .Values.backend.port }}
    {{- end }}
{{- end }}
