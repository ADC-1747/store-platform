apiVersion: batch/v1
kind: Job
metadata:
  name: medusa-publishable-key
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: medusa-bootstrap-sa
      restartPolicy: Never
      containers:
        - name: extract-key
          # image: ubuntu:22.04
          image: adc47/medusa-bootstrap:ubuntu-22.04
          imagePullPolicy: Always
          env:
            - name: PGPASSWORD
              value: {{ .Values.postgres.password }}
          command:
            - /bin/bash
            - -c
            - |
              set -e

              echo "🔑 Waiting for Postgres to be ready..."
              until pg_isready -h postgres -U {{ .Values.postgres.user }}; do
                echo "Waiting for postgres..."
                sleep 2
              done

              echo "🔑 Waiting for migrations to complete (checking for api_key table)..."
              MAX_RETRIES=30
              RETRY=0
              while [ $RETRY -lt $MAX_RETRIES ]; do
                if psql -h postgres -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }} -c "\dt api_key" 2>&1 | grep -q "api_key"; then
                  echo "✅ api_key table exists"
                  break
                fi
                echo "Waiting for api_key table... ($RETRY/$MAX_RETRIES)"
                sleep 2
                RETRY=$((RETRY + 1))
              done

              if [ $RETRY -eq $MAX_RETRIES ]; then
                echo "❌ ERROR: api_key table not found after $MAX_RETRIES retries"
                exit 1
              fi

              echo "🔑 Extracting publishable key from Postgres"
              PKEY=$(psql \
                -h postgres \
                -U {{ .Values.postgres.user }} \
                -d {{ .Values.postgres.database }} \
                -t -A \
                -c "SELECT token FROM api_key WHERE type='publishable' LIMIT 1;" 2>&1)

              if [ -z "$PKEY" ] || [ "$PKEY" = "" ]; then
                echo "❌ ERROR: Publishable key not found in database"
                echo "Checking api_key table contents:"
                psql -h postgres -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }} -c "SELECT type, token FROM api_key LIMIT 5;" || true
                exit 1
              fi

              # Remove any whitespace/newlines
              PKEY=$(echo "$PKEY" | tr -d '[:space:]')

              if [ -z "$PKEY" ] || [ ${#PKEY} -lt 10 ]; then
                echo "❌ ERROR: Invalid publishable key (too short or empty)"
                exit 1
              fi

              echo "✅ Publishable key extracted: ${PKEY:0:20}..."

              echo "🔑 Creating/updating ConfigMap medusa-storefront-config"
              kubectl create configmap medusa-storefront-config \
                --namespace {{ .Release.Namespace }} \
                --from-literal=NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY="$PKEY" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "✅ Publishable key stored in ConfigMap"

              echo "🔑 Restarting storefront pods to pick up new ConfigMap..."
              kubectl rollout restart deployment medusa-storefront -n {{ .Release.Namespace }} || echo "⚠️  Could not restart storefront (may not exist yet)"
