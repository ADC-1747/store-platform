apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store-medusa.postgresSecretName" . }}
  labels:
    {{- include "store-medusa.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgres.password | quote }}
  user: {{ .Values.postgres.user | quote }}
  database: {{ .Values.postgres.database | quote }}

