apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store-medusa.fullname" . }}
  labels:
    {{- include "store-medusa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "store-medusa.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "store-medusa.labels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z {{ include "store-medusa.fullname" . }}-postgres 5432; do
                sleep 5
              done
              echo "PostgreSQL is reachable"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: medusa
          image: "node:20-alpine"
          workingDir: /app
          command:
            - sh
            - -c
            - |
              set -e
              # Install build dependencies, python and git for initialization
              apk add --no-cache python3 make g++ git
              
              if [ ! -d "node_modules" ]; then
                echo "Initializing Medusa Starter..."
                # Disabled telemetry to avoid interactive prompts
                export MEDUSA_DISABLE_TELEMETRY=1
                npx --yes @medusajs/medusa-cli@latest new . -y --skip-db
                npm install
              fi
              echo "Running migrations..."
              export MEDUSA_DISABLE_TELEMETRY=1
              npx medusa migrations run
              echo "Starting Medusa..."
              npx medusa start -p 9000
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: MEDUSA_DISABLE_TELEMETRY
              value: "1"
            - name: DATABASE_URL
              value: "postgres://medusa_user:medusa_password@{{ include "store-medusa.fullname" . }}-postgres:5432/medusa_db"
            - name: REDIS_URL
              value: "redis://{{ include "store-medusa.fullname" . }}-redis:6379"
            - name: JWT_SECRET
              value: "supersecretjwt"
            - name: COOKIE_SECRET
              value: "supersecretcookie"
            - name: MEDUSA_ADMIN_ONBOARDING_TYPE
              value: "nextjs"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "store-medusa.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 9000
      protocol: TCP
      name: http
  selector:
    {{- include "store-medusa.selectorLabels" . | nindent 4 }}
