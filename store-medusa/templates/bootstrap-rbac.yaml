apiVersion: v1
kind: ServiceAccount
metadata:
  name: medusa-bootstrap-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: medusa-bootstrap-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: medusa-bootstrap-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: medusa-bootstrap-sa
roleRef:
  kind: Role
  name: medusa-bootstrap-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: medusa-storefront-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: medusa-storefront-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: medusa-storefront-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: medusa-storefront-sa
roleRef:
  kind: Role
  name: medusa-storefront-role
  apiGroup: rbac.authorization.k8s.io
