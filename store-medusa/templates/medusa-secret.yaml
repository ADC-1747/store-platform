apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store-medusa.medusaSecretName" . }}
  labels:
    {{- include "store-medusa.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwtSecret: {{ .Values.security.jwtSecret | default "supersecret" | quote }}  # WARNING: Default for local dev only - MUST override in production
  cookieSecret: {{ .Values.security.cookieSecret | default "supersecret" | quote }}  # WARNING: Default for local dev only - MUST override in production

